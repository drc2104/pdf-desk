<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 데스크 매뉴얼</title>
<meta name="description" content="PDF를 보고 고치는 무료 프로그램. 설치 파일 내려받기와 사용 방법을 한 화면에서 봅니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="PDF 데스크 설치·사용 매뉴얼">
<meta property="og:description" content="눌러서 내려받아 실행하면 자동으로 설치됩니다. 사용 방법도 여기서 봅니다.">
<meta property="og:image" content="https://drc2104.github.io/pdf-desk/og.jpg">
<meta property="og:url" content="https://drc2104.github.io/pdf-desk/">
<style>
:root{--bg:#f3f4f2;--panel:#fbfbfa;--side:#e9ebe7;--ink:#1c2220;--muted:#4c5652;--line:#cdd3cf;--accent:#9a5516;--accent-d:#7f4611;--cat:#1d6b6b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word}
button,a.btn{font:inherit;cursor:pointer}
.app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);overflow:hidden}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{font-size:20px;font-weight:700;padding:14px 16px 10px}
.brand small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.cats{display:flex;flex-direction:column}
.cats button{display:flex;justify-content:space-between;align-items:center;border:0;border-left:6px solid var(--c);background:transparent;padding:8px 12px 8px 14px;font-size:16px;text-align:left;color:var(--ink)}
.cats button:hover{background:#dfe2dd}
.cats button[aria-current=true]{background:var(--c);color:#fff;font-weight:700}
.cats .n{font-size:16px;font-variant-numeric:tabular-nums}
.foot{margin-top:auto;padding:12px 16px;font-size:13px;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{border:0;padding:6px 13px;font-size:16px;font-weight:700;background:color-mix(in srgb,var(--c) 13%,#fff);color:color-mix(in srgb,var(--c) 78%,#000)}
.tabs button[aria-selected=true]{background:var(--c);color:#fff}
.tabs .ok{font-size:13px;margin-left:6px;font-weight:700}
.now{display:flex;align-items:center;gap:14px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.now h1{font-size:18px;margin:0;flex:none}
.now p{margin:0;flex:1;min-width:0}
.now label{flex:none;display:flex;gap:7px;align-items:center;font-size:15px;font-weight:700;cursor:pointer}
.now input{width:22px;height:22px;accent-color:var(--accent)}
.next{flex:none;background:#fff;border:1px solid #8f9893;padding:5px 12px}
.next:hover{background:#eef0ec}
.body{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0;overflow:hidden}
.stage{min-width:0;min-height:0;padding:10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#dfe2dd}
.stage a.shot{display:flex;width:100%;flex:1;min-height:0;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;border:1px solid #aab2ad;display:block}
.cap{flex:none;font-size:14px;color:var(--ink)}
.hero{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);padding:22px}
.hero h2{font-size:22px;margin:0 0 6px}
.hero p{margin:0 0 14px}
.hero .dl{display:block;text-align:center;background:var(--accent);border:1px solid var(--accent-d);color:#fff;text-decoration:none;font-size:20px;font-weight:700;padding:14px}
.hero .dl:hover{background:#874a13}
.hero .sub{font-size:14px;color:var(--muted);margin:10px 0 0}
.fig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ss{background:#0a64ad;color:#fff;padding:12px 14px;min-height:150px;display:flex;flex-direction:column}
.ss h3{font-size:16px;margin:0 0 4px}
.ss p{font-size:13px;margin:0}
.ss .row{margin-top:auto;display:flex;justify-content:flex-end;gap:6px;padding-top:8px;align-items:center}
.ss .link{outline:3px solid #ffd21f;outline-offset:2px;font-size:14px;align-self:flex-start;margin-top:8px;text-decoration:underline}
.ss .b{border:1px solid #fff;padding:2px 12px;font-size:14px}
.ss .b.hit{outline:3px solid #ffd21f;outline-offset:2px;font-weight:700}
.figcap{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:14px 16px;overflow:auto;min-height:0}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 11px 32px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:23px;height:23px;line-height:23px;text-align:center;background:var(--c);color:#fff;font-size:14px;font-weight:700}
b.k{background:#eceee9;border:1px solid #c3c9c4;padding:0 5px;font-weight:700;white-space:nowrap}
.tip{border-top:1px solid var(--line);padding-top:9px;margin:2px 0 0;font-size:14px;color:var(--muted)}
.warn{border:2px solid #a23b1e;background:#fdf1ec;padding:9px 11px;margin:2px 0 0;font-size:15px;color:#7d2a13;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eceee9;width:42%;font-weight:700}
.mobile{display:none;background:#fff3e6;border-bottom:1px solid #e5c6a6;padding:8px 14px;font-size:14px}
@media (max-width:900px){
 html,body{height:auto}
 .app{display:block;height:auto;overflow:visible}
 .side{border-right:0;border-bottom:1px solid var(--line)}
 .cats{flex-direction:row;overflow-x:auto}
 .cats button{flex:none;border-left:0;border-bottom:4px solid var(--c);gap:6px;white-space:nowrap}
 .foot{display:none}
 .tabs{flex-wrap:nowrap;overflow-x:auto}
 .tabs button{flex:none}
 .now{flex-wrap:wrap}
 .now p{flex-basis:100%;order:3}
 .next{margin-left:auto}
 .body{display:block;overflow:visible}
 .stage{padding:8px}
 .stage a.shot{flex:none}
 .panel{border-left:0}
 .mobile{display:block}
 .hero .dl{display:none}
 .fig{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">PDF 데스크<small>설치·사용 매뉴얼</small></div>
    <div class="cats" id="cats"></div>
    <div class="foot">판 1.0.0 · 2026-11-10 작성<br>디알컴퍼니 · 무료</div>
  </nav>
  <main class="main">
    <div>
      <div class="mobile">설치는 PC에서 합니다. 휴대폰에서는 사용 방법만 볼 수 있습니다.</div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div class="now">
      <h1 id="title"></h1><p id="todo"></p>
      <label><input type="checkbox" id="done">해 봤어요</label>
      <button class="next" id="next"></button>
    </div>
    <div class="body">
      <div class="stage" id="stage"></div>
      <aside class="panel" id="panel"></aside>
    </div>
  </main>
</div>

const blocked=`<div class="hero"><h2>파란 창이 뜨면 이렇게 누릅니다</h2><div class="fig"><div class="ss"><h3>Windows의 PC 보호</h3><p>Microsoft Defender SmartScreen이 인식할 수 없는 앱의 시작을 차단했습니다.</p><span class="link">추가 정보</span><div class="row"><span class="b">실행 안 함</span></div></div><div class="ss"><h3>Windows의 PC 보호</h3><p>앱: PdfDeskSetup.exe<br>게시자: 알 수 없는 게시자</p><div class="row"><span class="b hit">실행</span><span class="b">실행 안 함</span></div></div></div><p class="figcap">설명용 그림입니다. 노란 테두리를 차례로 누르세요.</p><table><tr><th>내려받을 때 엣지 경고</th><td>파일 이름 옆 점 3개 → <b>유지</b> → <b>자세히 표시</b> → <b>그래도 계속</b></td></tr><tr><th>내려받을 때 크롬 경고</th><td><b>계속</b> 또는 <b>유지</b></td></tr></table><p class="sub">윈도우가 처음 보는 프로그램이면 나오는 안내입니다. 이 매뉴얼의 단추로 받은 파일에만 이렇게 하세요.</p></div>`;
const trouble=`<div class="hero"><h2>자주 생기는 일</h2><table>
<tr><th>더블클릭하면 다른 프로그램이 열려요</th><td>시작하기의 <b>기본 프로그램</b> 탭을 따라 해 주세요.</td></tr>
<tr><th>저장이 안 된다고 나와요</th><td>그 파일을 연 다른 프로그램을 닫거나 <b>다른 이름으로</b> 저장하세요.</td></tr>

<tr><th>설치할 때 열려 있다고 나와요</th><td>PDF 데스크를 닫고 설치 파일을 다시 실행하세요.</td></tr>
<tr><th>잘못 덮어 저장했어요</th><td>저장·되돌리기 묶음의 <b>원본 찾기</b> 탭을 보세요.</td></tr></table></div>`;

<tr><th>인터넷·로그인</th><td>필요 없습니다. 연 파일은 PC 밖으로 나가지 않습니다.</td></tr>
<tr><th>가격</th><td>무료</td></tr>
<tr><th>소스와 사용 조건</th><td><a href="https://github.com/drc2104/pdf-desk">프로그램 공개 저장소</a>에서 볼 수 있습니다.</td></tr></table></div>`;
const backup=`<div class="hero"><h2>보관된 원본 찾기</h2><p>아래 주소를 복사해 탐색기 맨 위 주소 칸에 붙여 넣습니다.</p><table><tr><td><code>%LOCALAPPDATA%\\PdfDesk\\backup</code></td></tr></table><button class="next" id="copybk" style="margin-top:10px">주소 복사</button><p class="sub">파일을 연 뒤 처음 덮어쓸 때 그 전 파일을 보관합니다. 최근 30개까지 남습니다.</p></div>`;
const removeH=`<div class="hero"><h2>프로그램 지우기</h2><p>윈도우 <b>설정 → 앱 → 설치된 앱</b>에서 <b>PDF 데스크</b>의 <b>제거</b>를 누릅니다.</p><p class="sub">갖고 있는 PDF 파일은 지워지지 않습니다.</p></div>`;

 {t:"기본 프로그램",todo:"PDF를 더블클릭하면 이 프로그램이 열리게 합니다.",img:"s_default",s:["왼쪽 <b class=k>설정</b>을 누릅니다.","오른쪽 <b class=k>이 프로그램으로 지정</b>을 누릅니다.","윈도우 설정 창에서 <b class=k>.pdf</b> 줄을 누릅니다.","<b class=k>PDF 데스크</b>를 고르고 <b class=k>기본값으로 설정</b>을 누릅니다."],tip:"윈도우 규칙상 이 한 번은 직접 눌러야 합니다."},
 {t:"화면 살펴보기",todo:"왼쪽에서 일을 고르고, 위쪽 탭에서 도구를 고릅니다.",img:"start",s:["PDF를 화면에 끌어다 놓거나 <b class=k>파일 열기</b>를 누릅니다.","왼쪽에서 할 일(글자·표시·서명·페이지)을 고릅니다.","위쪽 탭에서 도구를 고르면 안내 줄에 다음 할 일이 나옵니다.","오른쪽 칸에서 글꼴·색 같은 값을 정합니다."],tip:"Ctrl은 키보드 맨 아래 왼쪽 키입니다. Ctrl+휠 확대·축소, Ctrl+F 찾기, Ctrl+S 저장, Ctrl+Z 되돌리기."},

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let ci=0,ti=0;
const key=(c,t)=>"pd-done-"+C[c].id+"-"+t;
function counts(i){return C[i].tabs.filter((_,t)=>store.get(key(i,t))).length}
function drawCats(){$("cats").innerHTML=C.map((c,i)=>`<button style="--c:${c.c}" aria-current="${i===ci}" onclick="go(${i},0)">${c.name}<span class="n">${counts(i)}/${c.tabs.length}</span></button>`).join("")}
function drawTabs(){$("tabs").innerHTML=C[ci].tabs.map((x,i)=>`<button role="tab" aria-selected="${i===ti}" onclick="go(${ci},${i})">${x.t}${store.get(key(ci,i))?'<span class="ok">완료</span>':""}</button>`).join("")}
function go(c,t){ci=c;ti=t;draw();store.set("pd-pos",c+","+t)}
function draw(){
 const cat=C[ci],tab=cat.tabs[ti];
 document.documentElement.style.setProperty("--c",cat.c);
 drawCats();drawTabs();
 $("title").textContent=tab.t;$("todo").textContent=tab.todo;
 $("done").checked=!!store.get(key(ci,ti));
 $("stage").innerHTML=tab.html||`<a class="shot" href="img/${tab.img}.png" target="_blank" rel="noopener"><img src="img/${tab.img}.png" alt="${tab.t} 실제 화면"></a><div class="cap">붉은 네모가 누를 곳입니다. 그림을 누르면 크게 보입니다.</div>`;
 $("panel").innerHTML=`<ol class="steps">${tab.s.map(x=>`<li>${x}</li>`).join("")}</ol>${tab.warn?`<p class="warn">${tab.warn}</p>`:""}${tab.tip?`<p class="tip">${tab.tip}</p>`:""}${tab.copy?`<button class="next" id="copyurl">이 페이지 주소 복사</button>`:""}`;
 const n=$("next"),last=ti===cat.tabs.length-1,nextC=C[ci+1];
 if(!last){n.hidden=false;n.textContent="다음: "+cat.tabs[ti+1].t;n.onclick=()=>go(ci,ti+1)}
 else if(nextC){n.hidden=false;n.textContent="다음: "+nextC.name;n.onclick=()=>go(ci+1,0)}
 else n.hidden=true;
 const b=$("copybk");if(b)b.onclick=()=>copy("%LOCALAPPDATA%\\PdfDesk\\backup",b);
 const u=$("copyurl");if(u)u.onclick=()=>copy("https://drc2104.github.io/pdf-desk/",u);
}
function copy(text,btn){const old=btn.textContent;const end=()=>{btn.textContent="복사했습니다";setTimeout(()=>btn.textContent=old,1400)};
 if(navigator.clipboard)navigator.clipboard.writeText(text).then(end).catch(()=>{prompt("복사해 주세요",text)});else prompt("복사해 주세요",text)}
$("done").onchange=e=>{store.set(key(ci,ti),e.target.checked?"1":"");drawCats();drawTabs()};
const pos=(store.get("pd-pos")||"").split(",").map(Number);
if(pos.length===2&&C[pos[0]]&&C[pos[0]].tabs[pos[1]]){ci=pos[0];ti=pos[1]}
draw();
</script>
